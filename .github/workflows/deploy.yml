name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: topic-support-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/topic-support-bot

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import handlers; print('routers:', len(handlers.all_routers))"
        env:
          BOT_TOKEN: 123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
          SUPERGROUP_ID: -1001234567890

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy immutable image
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE='${IMAGE}:${GITHUB_SHA}' bash -s" <<'SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard "$GITHUB_SHA"
          if grep -q '^TOPIC_SUPPORT_BOT_IMAGE=' .env; then
            sed -i "s|^TOPIC_SUPPORT_BOT_IMAGE=.*|TOPIC_SUPPORT_BOT_IMAGE=$IMAGE|" .env
          else
            printf '\nTOPIC_SUPPORT_BOT_IMAGE=%s\n' "$IMAGE" >> .env
          fi
          chmod 600 .env
          docker compose pull topic_support_bot
          docker compose up -d --no-deps --force-recreate topic_support_bot
          for attempt in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Status}}' topic_support_bot 2>/dev/null || true)
            [ "$status" = running ] && sleep 5 && exit 0
            sleep 2
          done
          docker compose logs --no-color --tail=100 topic_support_bot
          exit 1
          SCRIPT
