services:
  topic_support_bot:
    container_name: topic_support_bot
    image: ${TOPIC_SUPPORT_BOT_IMAGE:-topic-support-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    init: true
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
